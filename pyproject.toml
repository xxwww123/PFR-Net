[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfrnet-reference"
version = "0.1.0"
description = "Reference implementation of the core PFR-Net method modules."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pfrnet_modules*"]
